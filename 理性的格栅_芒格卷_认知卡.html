原典，形成自己的判断", "tier": "通用学科", "grade": "D"}], "chapters": [{"num": "一", "title": "一把锤子为什么不够", "intro": "1994 年：一场不谈选股的投资演讲1994 年4 月14 日，查理·芒格在南加州大学马歇尔商学院演讲。台下坐的是商学院学生，邀请方想听的自然是选股。芒格开场的做法是宣布临时改题：他要先谈普世智慧，再谈投资。他把这称作\"祖母的规矩\"——先吃完胡萝卜，才准吃甜点。甜点是选股。胡萝卜是他认为比选股更值得讲的东西：一个成年人在进入任何专业判断之前，需要什么样的普遍知识结构。注意这个前提——芒格没有说\"选股不需要技巧\"，他说的是\"选股只是普世智慧这个大题目下的一个小分支\"。现代教育的"}, {"num": "二", "title": "多元思维模型怎样连成知识格栅", "intro": "1994 年：第一条规则第一章讲了为什么只有一把锤子不够。这一章要回答紧接着的那个问题：锤子不够，那几把才够，以及这几把之间靠什么连在一起。1994 年4 月14 日，查理·芒格在南加州大学马歇尔商学院演讲——开场\"临时改题\"、先普世智慧后选股的经过，第一章已经详述，这里直接从规1 他给出那条后来被反复引用的第一条规则：\"第一条规则是，你必须拥有多元思维模型——因为如果你只能使用一两个，研究人性的心理学表明，你将会扭曲现实，直到它符合你的思维模型。\"注意这条规则的两个动词：拥"}, {"num": "三", "title": "终身学习：让模型保持活性", "intro": "2007 年：学习机器2007 年5 月13 日，83 岁的芒格站在南加州大学法学院的毕业典礼讲台上。对着即将进入法律行业的一届毕业生，他没有讲执业技巧，而是讲了什么样的品质让人\"在人生中脱颖而出\"。他给的不是聪明，不是勤奋——至少不只是这两样。他给的是一台机器：\"我经常看到一些人在人生中脱颖而出，他们并非最聪明的，有时甚至不是最勤奋的，但他们是学习机器。每天晚上上床睡觉时，他们都比早上醒来时更聪明一点，而这一点真的很有用，尤其是当你前面还有很长的路要走的时候。\"这句话值得逐"}, {"num": "四", "title": "概率：把故事变成可以检验的判断", "intro": "1994 年：独腿人1994 年4 月14 日，南加州大学马歇尔商学院——同一场演讲，第一章开篇已完整还原。在讲完排列组合原理之后，芒格给了全场一句后来被引用了几十年的话：\"如果你没有把这个基本的但有些不那么自然的基础数学概率方法变成你生活的一部分，那么在漫长的人生中，你们将会像一个踢屁股比赛中的独腿人。这等于将巨大的优势拱手送给了他人。\"这句话里藏着三个必须拆开的词。第一个是\"基本\"。费马-帕斯卡的排列组合是高中数学，不是博士论文。芒格反复强调的从来不是高深数学，而是最底层"}, {"num": "五", "title": "逆向：先问怎样会失败", "intro": "1986 年：一份保证悲惨的药方1986 年6 月13 日，洛杉矶哈佛中学毕业典礼。芒格的小儿子菲利普是这届毕业生。芒格自称这是\"这辈子唯一的一次演讲\"——他坦言自己\"缺乏在重要场合公开发表演讲的经验\"，但\"胆量倒是练得炉火纯青\"。这场短短致辞后来成为《穷查理宝典》的开篇，也被一代又一代读者当成理解他的第一演讲开场，芒格先交代两件事：为什么选他，以及讲多久。为什么选他，他给了个自嘲的答案——校长在最老、服务年限最长的董事里挑演讲者，就像有人自豪地展示自己的马可以数到七：数学上"}, {"num": "六", "title": "反证、检查清单与第二次思考", "intro": "从失败清单到执行程序第五章问出了失败清单：先问怎样会失败，把已知的失败地点从路线里删掉。这一章的问题是清单列出来之后怎么办。把逆向往下推一步，会遇到一个更麻烦的处境：给别人挑错是容易的，轮到自己时，同一个错照犯。原因不在于不知道，而在于知道和做到之间隔着一整套程序——怎样让反证有机会推翻自己最珍爱的判断，怎样保证该检查的项目不漏掉，怎样在第一次思考得出答案之后，再做一次思考。愿望和程序的区别，用一个日常画面就能说清。戒烟的人全都知道该戒，靠的是愿望；飞行员起飞前逐条念检查单，"}, {"num": "七", "title": "误判不是偶然：心理倾向的系统", "intro": "1995 年：一份自学清单的诞生1995 年4 月24 日，波士顿港酒店。芒格站上讲台，讲了一场后来被称作\"如果你只有时间听一场查理·芒格的演讲，那就听这一场\"的演讲——人类误判心理学。1 开场第一句，他给出的不是方法，是兴趣：\"我一直对标准思维错误非常感兴趣。\"这句话里最要紧的词是\"标准\"。芒格说的不是偶发的、属于个别人的错误，而是有规律、可分类、会反复出现的错误——错误也像疾病一样分型分种，同一种错会在千万人身上以几乎相同的方式发作。为什么偏偏是芒格来整理这份清单？因为他"}, {"num": "八", "title": "激励：制度比劝诫更诚实", "intro": "清单第一位的倾向第七章最后留下了一个未展开的条目：奖惩超级反应，25 种倾向里的第一条。芒格把它排在首位，理由只有一句话——几乎人人都会低估激励的力1 这不是修辞，是他的自我诊断：他自认一辈子对激励的理解都在同龄人的前5%，仍然年年被它超出预期，一辈子都在低估它。2 一个把这件事想了五十年的人都说自己低估，普通人默认的\"我了解自己的动机\"，可信度有多高，可想而知。本章的定义性引文，是编者对芒格主张的标准概括：\"人对激励的反应，远比几乎所有人预想的都要强烈，所以要预测行为，先看"}, {"num": "九", "title": "群体、权威与被剥夺感", "intro": "影响判断的第三股力量第八章看的是\"什么被奖励\"：制度通过激励塑造行为。本章看的是\"谁在影响你\"：人不是独立判断的原子，是生活在群体里的动物，行为会被身边的人、被权威、被得失的不对称性反复改写。第七章把25 种倾向按功能分成五组时预告过，社会认同、权威与被剥夺感三条将单独成章；本章就是这三条三条倾向有一个共同点：它们都发生在\"判断者与外部世界的关系\"里。激励类倾向（第八章）藏在制度里，认知捷径类倾向藏在脑子里的省力机制里；而本章这三条，藏在关系里——你判断时的位置。你的计算没有"}, {"num": "十", "title": "当偏误彼此增强", "intro": "合流的地方第七章列出了全部25 种倾向，第八章解剖了激励，第九章解剖了社会认同、权威与被剥夺感——每一条都单独成立，每一条都讲得清机制。但真实的判断失误很少只由一条倾向造成。第七章列出25 种倾向时说过一句话，那时只当作引子带过：倾向不是各管各的，它们在生活中不可分割地交织在一起（完整引文见第七章\"倾向是系统\"一节）。1 第七章还预告：叠加的机制细节，要到本章展开。2 本章就是兑现那个预告的地方。本章的核心问题：为什么多个普通因素会合成极端结果？注意\"普通\"两个字。下面要讲的"}, {"num": "十一", "title": "穿过会计看商业现实", "intro": "安然：报表最漂亮的那一年2001 年初，安然公司的股价在每股90 美元附近。《财富》杂志连续六年把它评为\"美国最具创新力的公司\"，华尔街的分析师们争先恐后给出\"强烈买入\"评级。安然的报表看上去无懈可击：收入从1996 年的133 亿美元一路涨到2000 年的1010 亿美元，五年翻了将近八倍。这样的增长数字，足以让大多数投资人停止提问。但芒格没有买，巴菲特也没有买。不是因为他们掌握什么内幕，而是因为他们懂会计——更准确地说，懂会计的局限。芒格后来回忆，他和巴菲特读安然的报表时"}, {"num": "十二", "title": "好企业让少行动成为优势", "intro": "1972 年那盒糖果：转折点伯克希尔后来的投资方式，被一盒巧克力改写过。1972 年收购喜诗糖果的来龙去脉——为什么出高价、品牌的价值在哪里——第一章已经完整讲过，这里不再重述（见第一章 一把锤子为什么不够）。1 这一章要讲的不是这笔收购本身，而是它留下的转折点。把转变讲透，需要一个五十年后的细节。2023 年，芒格在唯一的长期播客访谈里复盘喜诗，说到当年买下之后的事：\"我们很快就发现，每年可以把价格提高10%，谁都不在乎。我们并没有让销量上去之类，只是让利润上去了。\"\"谁都"}, {"num": "十三", "title": "少数机会、集中下注与资本配置", "intro": "1962 年的一千美元：机会的代价2016 年每日期刊年会上，芒格讲了一个自己的小故事。1962 年，他投了一千美元买下某处石油矿区的权利金；此后数十年，这一千美元每年带回约十万美元的回报。1 一个低效小角落里的冷门交易，因为识别的人在少数、竞争不激烈，所以价格不高；一旦确认回报远高于当时存在的任何替代机会，就把钱放进去，然后什么事都不做，让它自己跑。这个故事在第四章演变的末尾被提过一笔——那里拿它说明概率思维被用在机会成本上的样子；这一章要把它当作一个问题来拆：当一千美元面"}, {"num": "十四", "title": "应得信任：合作如何降低摩擦", "intro": "1959 年的那个晚上1959 年，两个奥马哈人在一场晚宴上第一次见面。35 岁的巴菲特和一位共同的朋友坐在餐桌一侧，35 岁的芒格坐在另一侧。巴菲特后来回忆：查理讲了整个晚上，坐在我旁边的那位朋友只能听。1 他不是在炫，他是脑子里确实装了这么多东西——历史、物理、心理、法律、商业，并且能在一个话题结束之后不需要任何过渡词就跳到下一个。巴菲特当时已在做投资合伙生意，芒格还在经营自己的律师事务所。他们都看出来了对方是同类人——但谁也没急着合伙。两人各自继续自己的事业。芒格196"}, {"num": "十五", "title": "避免惯常的失败方式", "intro": "1953 年，帕萨迪纳的街头芒格的第一个儿子叫泰迪，9 岁那年死于白血病。那是1953 年前后，白血病尚无法治愈。芒格的第一段婚姻也在同一年结束——离婚后不久，泰迪确诊。一个反复被讲述的事实是：芒格探望了垂死的儿子，然后独自走在帕萨迪纳的街头，泪流满面。1 那年他29 岁。他的传记作者说，这件事改变了他。但没有一个人能说出他因此变成了什么样——因为他没有变成任何人可以从外表辨认出的\"另一种人\"。二十多年后，他在演讲里公开了当时没有说出口的那条内心纪律。2007年，83 岁的芒"}, {"num": "十六", "title": "理性近乎一种道德义务", "intro": "2020 年12 月，一场线上对话96 岁的芒格坐在洛杉矶家中的椅子上，面对屏幕。加州理工学院把杰出校友奖颁给了他，校友关系办公室组织了一场线上对谈——不是在股东大会上应对投资者，也不是在毕业典礼上面对年轻人。采访者是他认识了几十年的朋友。镜头前只有一个老人，回顾自己漫长的一生。对谈中他重申了自己几十年来一直在讲的那些道理：他和巴菲特的合伙关系靠的不是合同条款，是性情相投和相互信任；好市多是那种你一辈子只想找到三家的企业；跨学科思维模型是他最珍视的认知框架。这些都不是新东西。"}]};

function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function renderChapters(){
  document.getElementById("chapters").innerHTML=DATA.chapters.map(c=>`
    <div class="card ch"><span class="tag">第${c.num}章</span>
    <div class="name">${esc(c.title)}</div><div class="desc">${esc(c.intro)}</div></div>`).join("");
}
function renderModels(){
  const t=q.trim().toLowerCase();
  const list=DATA.models.filter(m=>{
    if(activeTier!=="all"&&m.tier!==activeTier)return false;
    if(t&&!((m.name+m.desc+m.code).toLowerCase().includes(t)))return false;
    return true;
  });
  document.getElementById("models").innerHTML=list.map(m=>`
    <div class="card"><span class="tag tier-${m.tier}">${TIER[m.tier]||m.tier}</span>
    <div class="name">${esc(m.name)}</div><div class="desc">${esc(m.desc)}</div>
    <div class="code">${esc(m.code)} · 分级 ${esc(m.grade||"-")}</div></div>`).join("");
  document.getElementById("count").textContent=`当前显示 ${list.length} / ${DATA.models.length} 个模型`;
}
document.getElementById("q").addEventListener("input",e=>{q=e.target.value;renderModels();});
document.getElementById("filters").addEventListener("click",e=>{
  if(e.target.tagName!=="BUTTON")return;
  activeTier=e.target.dataset.t;
  [...document.querySelectorAll("#filters button")].forEach(b=>b.classList.toggle("on",b===e.target));
  renderModels();
});
renderChapters(); renderModels();
</script>
</body>
</html>
