<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>高性价比人生指南 · 50 认知卡</title>
<style>
  :root{--bg:#f5f7fa;--card:#fff;--ink:#1f2933;--sub:#6b7785;--line:#e3e8ef;--brand:#2f6fed;--radius:14px;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;padding:28px 16px 64px;}
  .head{text-align:center;margin-bottom:22px}
  .head h1{font-size:30px;margin:0 0 6px}
  .head p{font-size:15px;color:var(--sub);margin:0}
  .bar{position:sticky;top:0;background:var(--bg);padding:12px 0 10px;z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
  .bar input{flex:1;min-width:200px;max-width:420px;padding:10px 14px;font-size:16px;border:1px solid var(--line);border-radius:10px;outline:none}
  .filters{display:flex;gap:8px;flex-wrap:wrap}
  .filters button{padding:8px 14px;font-size:14px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:20px;cursor:pointer}
  .filters button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .count{width:100%;text-align:center;font-size:13px;color:var(--sub)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;max-width:1200px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px 14px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .card .tag{display:inline-block;font-size:12px;color:#fff;background:#9aa5b1;border-radius:6px;padding:2px 8px;margin-bottom:8px}
  .card .name{font-size:18px;font-weight:700;margin-bottom:6px}
  .card .desc{font-size:14px;color:var(--sub)}
  .card .code{font-size:12px;color:#8a94a3;margin-top:8px;font-family:ui-monospace,Menlo,monospace}
  .tier-保命防意外{background:#d64545}
  .tier-日常防慢病{background:#e08616}
  .tier-筛查与疫苗{background:#b58b00}
  .tier-紧急处置{background:#b03a5b}
  .tier-钱与保障{background:#2f9d55}
  .tier-法律红线{background:#2f6fed}
  .tier-职场与工伤{background:#0e8f8f}
  .tier-家庭与育儿{background:#7a5af0}
  .foot{max-width:1200px;margin:36px auto 0;font-size:13px;color:var(--sub);text-align:center;line-height:1.8}
  .foot a{color:var(--brand);text-decoration:none}
</style>
</head>
<body>
  <div class="head">
    <h1>高性价比人生指南 · 50 认知卡</h1>
    <p>选自《高性价比人生指南》689 条建议 ｜ 45 条 A 级证据 ｜ 37 条零成本 ｜ 覆盖 8 大领域</p>
  </div>
  <div class="bar">
    <input id="q" placeholder="搜索标题 / 关键词 / 原书编号…">
    <div class="filters" id="filters">
      <button data-t="all" class="on">全部</button>
      <button data-t="保命防意外">保命防意外</button>
      <button data-t="日常防慢病">日常防慢病</button>
      <button data-t="筛查与疫苗">筛查与疫苗</button>
      <button data-t="紧急处置">紧急处置</button>
      <button data-t="钱与保障">钱与保障</button>
      <button data-t="法律红线">法律红线</button>
      <button data-t="职场与工伤">职场与工伤</button>
      <button data-t="家庭与育儿">家庭与育儿</button>
    </div>
    <div class="count" id="count"></div>
  </div>
  <div class="grid" id="cards"></div>
  <div class="foot">
    内容源自 eternity4719《高性价比人生指南》（CC BY 4.0），689 条建议均注明成本、收益、证据等级与期刊/官方出处；本卡为精选 50 条的浓缩版，编号可在原书检索页回溯。<br>
    原书仓库：<a href="https://github.com/eternity4719/HowToLiveBetter" target="_blank" rel="noopener">github.com/eternity4719/HowToLiveBetter</a>
  </div>
<script>
const DATA = [
{"code":"01-1","name":"系安全带，前排后排都系","desc":"上车多花 2 秒，前排致命伤风险降约一半；2022 年美国一半的车内死者没系带","tier":"保命防意外","grade":"A","cost":"零成本"},
{"code":"01-2","name":"骑摩托车、电动自行车戴头盔并扣好","desc":"扣好扣带，骑手死亡风险降 42%、头部损伤降 69%；扣带松垮挂在头上不算戴","tier":"保命防意外","grade":"A","cost":"百元内"},
{"code":"01-3","name":"装烟雾报警器；烧煤燃气取暖再装一氧化碳报警器","desc":"火灾死亡风险降约六成；中国 2018 年 1.15 万人死于煤气中毒，七成死在家中","tier":"保命防意外","grade":"B","cost":"百元内"},
{"code":"01-10","name":"坐车时给 4 岁以下儿童用安全座椅","desc":"婴儿致命伤风险降 71%、1-4 岁降 54%；抱在怀里急刹车时抱不住","tier":"保命防意外","grade":"A","cost":"千元级"},
{"code":"01-16","name":"女性接种 HPV 疫苗，越早越好","desc":"瑞典 167 万女性数据：17 岁前接种，宫颈癌风险低约 88%；30 岁后打收益递减","tier":"保命防意外","grade":"A","cost":"千元级"},
{"code":"01-35","name":"别拿「少一个肾没什么」换钱","desc":"卖肾者 6 年后 86% 身体变差、四分之三仍负债；黑市无筛查无复查，结局是另一种","tier":"保命防意外","grade":"A","cost":"零成本"},
{"code":"13-12","name":"大出血先用手死死压住伤口，压不住上止血带","desc":"休克前上止血带存活 90%，休克后才上的仅 10%；别拿鞋带绳子代替，上了不松开","tier":"保命防意外","grade":"A","cost":"百元内"},
{"code":"02-1","name":"戒烟，越早越好","desc":"吸烟者平均少活 10 年以上；40 岁前戒掉，可消除约九成吸烟带来的死亡风险","tier":"日常防慢病","grade":"A","cost":"零成本"},
{"code":"02-3","name":"戒烟别光靠忍，先去拿药","desc":"伐尼克兰戒烟成功率是安慰剂的 2.32 倍；贴片加咀嚼胶比单用一种再高 27%","tier":"日常防慢病","grade":"A","cost":"千元内"},
{"code":"02-8","name":"不嚼槟榔","desc":"38.8 万人汇总：嚼槟榔死亡风险高 21%、糖尿病风险高 47%，口腔癌和食管癌另算","tier":"日常防慢病","grade":"A","cost":"零成本"},
{"code":"02-11","name":"每天走到 7000–8000 步","desc":"比 3500 步/天的人死亡风险低约 45%；60 岁以上走到 6000-8000 步收益就趋平","tier":"日常防慢病","grade":"A","cost":"零成本"},
{"code":"02-13","name":"每晚睡 7 小时左右，作息固定","desc":"作息规律比睡多久更能预测死亡：最规律者比最不规律者低 20%–48%","tier":"日常防慢病","grade":"A","cost":"零成本"},
{"code":"02-18","name":"少吃加工肉（火腿、培根、香肠、午餐肉）","desc":"吃得最多组死亡风险高约 23%；每天多吃一份，风险也高两成","tier":"日常防慢病","grade":"A","cost":"零成本"},
{"code":"01-7","name":"量血压，高了就吃药降到达标","desc":"收缩压每降 10 mmHg，大心血管事件低两成；中国 35-75 岁 44.7% 有高血压，控制住的仅 7.2%","tier":"筛查与疫苗","grade":"A","cost":"百元内"},
{"code":"01-19","name":"45 到 50 岁起做结直肠癌筛查","desc":"每 1-2 年做几十元的粪便隐血检查，死亡风险低约 16%；查过一轮的人低 25%","tier":"筛查与疫苗","grade":"A","cost":"百元内"},
{"code":"01-20","name":"有心血管病的人和老年人每年打流感疫苗","desc":"心梗后接种组一年死亡率 2.9%，安慰剂组 4.9%；一针 50-150 元","tier":"筛查与疫苗","grade":"A","cost":"百元内"},
{"code":"01-23","name":"查幽门螺杆菌，阳性就根除","desc":"跟踪 22 年的随机试验：根除者胃癌风险低约一半、死于胃癌低 38%","tier":"筛查与疫苗","grade":"A","cost":"几百元"},
{"code":"20-3","name":"按国家免疫规划把疫苗打齐","desc":"免疫规划疫苗全程免费，接种单位不得收钱；漏打入学必被查出，只补未完剂次","tier":"筛查与疫苗","grade":"A","cost":"零成本"},
{"code":"13-1","name":"有人倒地没呼吸，立刻用力按压胸口","desc":"心脏骤停 79.2% 发生在家中；有人按压，活着出院率从 3.9% 升到 16.1%","tier":"紧急处置","grade":"A","cost":"零成本"},
{"code":"13-3","name":"突然嘴歪、一侧胳膊没劲、说话不清，立刻打 120","desc":"发病 3 小时内溶栓，恢复生活自理的可能性是不溶栓的 1.75 倍；超 4.5 小时没差别","tier":"紧急处置","grade":"A","cost":"零成本"},
{"code":"13-13","name":"被狗、猫咬伤或抓破皮，肥皂水流水冲 15 分钟","desc":"狂犬病病死率几乎 100%；暴露级别按伤口定、不按狗的来历定，三级暴露加打免疫制剂","tier":"紧急处置","grade":"A","cost":"几百元"},
{"code":"13-14","name":"烫伤后立刻用凉的流动水冲 20 分钟","desc":"3 小时内冲够 20 分钟，植皮需求降到六成；别抹牙膏酱油，冰敷会加重损伤","tier":"紧急处置","grade":"A","cost":"零成本"},
{"code":"13-26","name":"有人噎住说不出话，5 次拍背加 5 次腹部冲击","desc":"还能咳的让他自己咳；说不出话就站到背后循环做，倒下立即心肺复苏","tier":"紧急处置","grade":"B","cost":"零成本"},
{"code":"13-38","name":"可能被 HIV 暴露了，72 小时内去拿阻断药","desc":"最好 2 小时内、最迟不超过 72 小时，连吃 28 天；超时这条路就没了","tier":"紧急处置","grade":"B","cost":"千元级"},
{"code":"34-1","name":"同吃两种感冒药前，先看成分表","desc":"对乙酰氨基酚只能占一种，双份伤肝；美国急性肝衰竭里近三成没等到换肝","tier":"紧急处置","grade":"B","cost":"零成本"},
{"code":"05-6","name":"看到「高收益」「保本」「稳赚」直接走开","desc":"监管原话：收益率超 6% 打问号、超 8% 很危险、10% 以上准备赔光本金","tier":"钱与保障","grade":"A","cost":"零成本"},
{"code":"05-12","name":"优先选集采中选药和过评仿制药","desc":"集采平均降价 53%、最高 93%；开药买药多问一句「有没有集采的、通用名的」","tier":"钱与保障","grade":"A","cost":"零成本"},
{"code":"05-13","name":"在医保 App 上办一次家庭共济绑定","desc":"职工医保个人账户的钱就能给配偶、父母、子女看病买药；很多人账户正躺着几千元","tier":"钱与保障","grade":"A","cost":"零成本"},
{"code":"05-20","name":"税率 10% 及以上的人开个人养老金账户","desc":"每年最多省 840-3240 元；税率只有 3% 和不交个税的人，开了不划算","tier":"钱与保障","grade":"A","cost":"零成本"},
{"code":"05-26","name":"三者险买够","desc":"交强险死亡伤残只赔 18 万、医疗费 1.8 万，超出部分从自己家出","tier":"钱与保障","grade":"A","cost":"千元/年"},
{"code":"05-45","name":"别拿钱买比特币、泰达币这类虚拟货币","desc":"八部门 2026 年通知：投资损失自行承担；有人买 44.8 万元泰达币，起诉被驳回","tier":"钱与保障","grade":"A","cost":"零成本"},
{"code":"15-4","name":"租长租公寓先查它的资金监管账户","desc":"一次性付一年折扣有限，公司倒了押金剩租一起没；绑了租金贷更糟","tier":"钱与保障","grade":"A","cost":"零成本"},
{"code":"08-1","name":"出了交通事故先停车、救人、报警，不要跑","desc":"逃逸默认全责、终身禁考驾照，车损险和三者险一律不赔，几十万自己掏","tier":"法律红线","grade":"A","cost":"零成本"},
{"code":"08-8","name":"不把银行卡、手机卡、支付账号借给任何人","desc":"没收违法所得再罚 1-10 倍；明知对方犯罪还帮着收钱转钱，就是帮信罪","tier":"法律红线","grade":"A","cost":"零成本"},
{"code":"08-10","name":"起了冲突先报警不动手","desc":"打人拘留 5-10 日、罚 500-1000；打成轻伤判 3 年以下；先动手的几乎一定吃亏","tier":"法律红线","grade":"A","cost":"零成本"},
{"code":"08-19","name":"维权有期限：民事诉讼 3 年，劳动仲裁 1 年","desc":"一条留了痕迹的催款消息就能让 3 年重新起算；什么都不做可能丢掉胜诉资格","tier":"法律红线","grade":"A","cost":"零成本"},
{"code":"09-9","name":"阳台、窗户不往外扔任何东西","desc":"没砸到人也能拘留；21 楼扔酒瓶砸伤学生判 10 年，32 楼扔砖头砸死人核准死刑","tier":"法律红线","grade":"A","cost":"零成本"},
{"code":"08-43","name":"被家暴了：先报警，再申请人身安全保护令","desc":"被掐过脖子的女性后来被杀的几率是没被掐过的 7.48 倍；保护令不收费、72 小时内裁定","tier":"法律红线","grade":"A","cost":"零成本"},
{"code":"19-1","name":"加班费按 1.5 倍、2 倍、3 倍三档算","desc":"法定假日 3 倍不能拿补休顶掉；单位逾期不付，还要加付 50%-100% 赔偿金","tier":"职场与工伤","grade":"A","cost":"零成本"},
{"code":"19-4","name":"被裁先算清 N","desc":"每满一年一个月工资；月工资按离职前 12 个月平均，奖金津贴补贴都算进去","tier":"职场与工伤","grade":"A","cost":"零成本"},
{"code":"19-7","name":"不要签「个人原因主动辞职」","desc":"一签，经济补偿和失业保险金通常一起落空；不必当天签，冷静一晚再说","tier":"职场与工伤","grade":"B","cost":"零成本"},
{"code":"19-11","name":"上班受伤，第一件事是做工伤认定","desc":"单位 30 天内不报，你自己 1 年内去报；不做认定，医药费伤残补助全部落空","tier":"职场与工伤","grade":"A","cost":"零成本"},
{"code":"19-13","name":"单位没给你交工伤保险，工伤待遇一样有","desc":"由单位按同样项目和标准全额付；「没买工伤险所以赔不了」是假话","tier":"职场与工伤","grade":"A","cost":"零成本"},
{"code":"07-1","name":"失业了先在线申领失业保险金","desc":"缴满 1 年、非本人意愿离职就能领，最多 24 个月；领钱期间医保由失业保险替你交","tier":"职场与工伤","grade":"A","cost":"零成本"},
{"code":"27-1","name":"备孕每天补 0.4 毫克叶酸","desc":"胎儿神经管缺陷风险降约七成；关键在怀孕前就开始吃，神经管受孕 28 天内就长合","tier":"家庭与育儿","grade":"A","cost":"零成本"},
{"code":"27-4","name":"孕期一支烟一口酒都不要","desc":"孕期吸烟使异常出血风险翻倍、提高唇腭裂风险；二手烟同样算，同住家人别在屋里抽","tier":"家庭与育儿","grade":"A","cost":"零成本"},
{"code":"20-1","name":"让婴儿仰着睡，同房不同床","desc":"美国每年约 3500 名婴儿死于睡眠相关原因；床上不放枕头、被子、床围和毛绒玩具","tier":"家庭与育儿","grade":"A","cost":"零成本"},
{"code":"20-5","name":"冲奶粉用 70℃ 以上的水","desc":"阪崎克罗诺杆菌新生儿病死率 40%-80%；73.8℃ 时加奶粉，可杀菌到十万分之一以下","tier":"家庭与育儿","grade":"A","cost":"零成本"},
{"code":"30-4","name":"让孩子每天在户外待够 2 小时","desc":"目前唯一有随机试验支持的防近视办法：每天多 40 分钟户外课，3 年新近视从 39.5% 降到 30.4%","tier":"家庭与育儿","grade":"A","cost":"零成本"},
{"code":"30-16","name":"管孩子别动手打，也别吼骂、骂他笨","desc":"16 万名孩子汇总：挨打与攻击性、心理问题、亲子关系差全部正相关；当场听话却看不出来","tier":"家庭与育儿","grade":"A","cost":"零成本"}
];
let activeTier="all", q="";
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function render(){
  const t=q.trim().toLowerCase();
  const list=DATA.filter(m=>{
    if(activeTier!=="all"&&m.tier!==activeTier)return false;
    if(t&&!((m.name+m.desc+m.code+m.tier).toLowerCase().includes(t)))return false;
    return true;
  });
  document.getElementById("cards").innerHTML=list.map(m=>`
    <div class="card"><span class="tag tier-${m.tier}">${m.tier}</span>
    <div class="name">${esc(m.name)}</div><div class="desc">${esc(m.desc)}</div>
    <div class="code">原书 ${esc(m.code)} · 证据 ${esc(m.grade)} · ${esc(m.cost)}</div></div>`).join("");
  document.getElementById("count").textContent=`当前显示 ${list.length} / ${DATA.length} 条`;
}
document.getElementById("q").addEventListener("input",e=>{q=e.target.value;render();});
document.getElementById("filters").addEventListener("click",e=>{
  if(e.target.tagName!=="BUTTON")return;
  activeTier=e.target.dataset.t;
  [...document.querySelectorAll("#filters button")].forEach(b=>b.classList.toggle("on",b===e.target));
  render();
});
render();
</script>
</body>
</html>
